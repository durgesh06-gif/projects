<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #0ea5e9, #2563eb);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .weather-app {
      background: rgba(0, 0, 0, 0.25);
      padding: 25px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      margin-bottom: 10px;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      background: #22c55e;
      color: #000;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 15px;
    }

    button:hover {
      background: #16a34a;
    }

    .weather {
      display: none;
    }

    .temp {
      font-size: 2.5rem;
      font-weight: bold;
    }

    .details {
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .error {
      color: #fecaca;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="weather-app">
    <h1>Weather App</h1>

    <input type="text" id="cityInput" placeholder="Enter city name">
    <button onclick="getWeatherByCity()">Search</button>
    <button onclick="getWeatherByLocation()">Use My Location</button>

    <div class="weather" id="weather">
      <h2 id="city"></h2>
      <img id="icon" alt="Weather Icon">
      <div class="temp" id="temperature"></div>
      <div id="condition"></div>

      <div class="details">
        <div id="humidity"></div>
        <div id="wind"></div>
      </div>
    </div>

    <div class="error" id="error"></div>
  </div>

  <script>
    const API_KEY = "a37e70ddb6c746fc15fb0a454bf7720c"; // <-- Insert your OpenWeatherMap API key

    const weatherDiv = document.getElementById("weather");
    const errorDiv = document.getElementById("error");

    function displayWeather(data) {
      document.getElementById("city").textContent = data.name;
      document.getElementById("temperature").textContent =
        Math.round(data.main.temp) + "°C";
      document.getElementById("condition").textContent =
        data.weather[0].description;
      document.getElementById("humidity").textContent =
        "Humidity: " + data.main.humidity + "%";
      document.getElementById("wind").textContent =
        "Wind: " + data.wind.speed + " m/s";

      document.getElementById("icon").src =
        `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;

      weatherDiv.style.display = "block";
      errorDiv.textContent = "";
    }

    function getWeatherByCity() {
      const city = document.getElementById("cityInput").value.trim();
      if (!city) return;

      fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${API_KEY}`)
        .then(res => {
          if (!res.ok) throw new Error("City not found");
          return res.json();
        })
        .then(displayWeather)
        .catch(err => {
          errorDiv.textContent = err.message;
          weatherDiv.style.display = "none";
        });
    }

    function getWeatherByLocation() {
      if (!navigator.geolocation) {
        errorDiv.textContent = "Geolocation is not supported.";
        return;
      }

      navigator.geolocation.getCurrentPosition(position => {
        const { latitude, longitude } = position.coords;

        fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&units=metric&appid=${API_KEY}`)
          .then(res => res.json())
          .then(displayWeather)
          .catch(() => {
            errorDiv.textContent = "Unable to retrieve weather data.";
          });
      }, () => {
        errorDiv.textContent = "Location access denied.";
      });
    }
  </script>

</body>
</html>
