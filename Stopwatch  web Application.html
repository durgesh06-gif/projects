<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stopwatch App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .stopwatch {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .time {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      margin: 0 5px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    .start { background: #22c55e; }
    .pause { background: #fbbf24; }
    .reset { background: #ef4444; }
    .lap   { background: #38bdf8; }

    button:hover {
      opacity: 0.9;
    }

    ul {
      list-style: none;
      padding: 0;
      max-height: 150px;
      overflow-y: auto;
    }

    ul li {
      padding: 6px;
      background: #334155;
      margin-bottom: 5px;
      border-radius: 4px;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <div class="stopwatch">
    <div class="time" id="display">00:00:00.00</div>

    <div class="buttons">
      <button class="start" onclick="start()">Start</button>
      <button class="pause" onclick="pause()">Pause</button>
      <button class="reset" onclick="reset()">Reset</button>
      <button class="lap" onclick="lap()">Lap</button>
    </div>

    <ul id="laps"></ul>
  </div>

  <script>
    let startTime = 0;
    let elapsedTime = 0;
    let timerInterval;
    let running = false;
    let lapCount = 1;

    function formatTime(ms) {
      let milliseconds = Math.floor((ms % 1000) / 10);
      let seconds = Math.floor((ms / 1000) % 60);
      let minutes = Math.floor((ms / (1000 * 60)) % 60);
      let hours = Math.floor(ms / (1000 * 60 * 60));

      return (
        String(hours).padStart(2, '0') + ":" +
        String(minutes).padStart(2, '0') + ":" +
        String(seconds).padStart(2, '0') + "." +
        String(milliseconds).padStart(2, '0')
      );
    }

    function start() {
      if (!running) {
        running = true;
        startTime = Date.now() - elapsedTime;
        timerInterval = setInterval(() => {
          elapsedTime = Date.now() - startTime;
          document.getElementById("display").textContent = formatTime(elapsedTime);
        }, 10);
      }
    }

    function pause() {
      running = false;
      clearInterval(timerInterval);
    }

    function reset() {
      running = false;
      clearInterval(timerInterval);
      elapsedTime = 0;
      lapCount = 1;
      document.getElementById("display").textContent = "00:00:00.00";
      document.getElementById("laps").innerHTML = "";
    }

    function lap() {
      if (running) {
        const lapTime = document.createElement("li");
        lapTime.textContent = `Lap ${lapCount++}: ${formatTime(elapsedTime)}`;
        document.getElementById("laps").appendChild(lapTime);
      }
    }
  </script>

</body>
</html>
